[project]
name = "alma"
version = "0.1.0"
description = "ALMA (TONO-LAB): monitoreo de salud cuerpo+máquina para astronautas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
